name: Remove default merchant fallback

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Remove all default merchant fallbacks') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove fallback from App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = "merchant?.uid || 'default_merchant'"
          count = text.count(old)
          if count == 0:
              raise SystemExit('No default merchant fallback found in App.tsx')
          text = text.replace(old, 'merchant?.uid')
          path.write_text(text, encoding='utf-8')
          print(f'Removed {count} default merchant fallback(s)')
          PY

      - name: Verify no fallback remains
        run: |
          if grep -RIn --exclude-dir=.git --exclude='cleanup-default-merchant.yml' "default_merchant" src; then
            echo 'default_merchant still exists in src/'
            exit 1
          fi

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Remove all default merchant fallbacks'
          git push
