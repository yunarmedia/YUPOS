name: Remove default merchant fallback

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Remove all default merchant fallbacks') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove all default merchant fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('src')
          replacements = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              count = text.count("'default_merchant'") + text.count('"default_merchant"')
              if count:
                  text = text.replace("'default_merchant'", "''").replace('"default_merchant"', "''")
                  path.write_text(text, encoding='utf-8')
                  replacements += count
                  print(f'{path}: removed {count}')
          if replacements == 0:
              raise SystemExit('No default_merchant literal found in src/')
          print(f'Total removed: {replacements}')
          PY

      - name: Verify no fallback remains
        run: |
          if grep -RIn --exclude-dir=.git "default_merchant" src; then
            echo 'default_merchant still exists in src/'
            exit 1
          fi

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Remove all default merchant fallbacks'
          git push
