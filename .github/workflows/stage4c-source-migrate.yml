name: Stage 4C Source Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source migration
        run: node scripts/stage4c-source-migrate.mjs
      - name: Validate source migration
        run: |
          grep -q 'STAGE4C_SOURCE_MIGRATED' src/App.tsx
          grep -q 'async function recordCustomerVisit' src/services/customerService.ts
          grep -q 'async function claimMembershipReward' src/services/customerService.ts
      - name: Commit source and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/customerService.ts src/components/CustomerView.tsx scripts/stage4c-source-migrate.mjs .github/workflows/stage4c-source-migrate.yml
          git rm scripts/stage4c-source-migrate.mjs .github/workflows/stage4c-source-migrate.yml
          git commit -m "fix: make settings and customer persistence cloud-authoritative"
          git push
