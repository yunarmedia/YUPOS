name: Stage 4B Source Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply Stage 4B directly to source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/App.tsx';
          let s = fs.readFileSync(path, 'utf8');

          if (s.includes('// STAGE4B_SOURCE_MIGRATED')) {
            console.log('Stage 4B already applied. Nothing to do.');
            process.exit(0);
          }

          const handlers = [
            ['const handleSaveOrder = (', 'const handleSaveOrder = async ('],
            ['const handleSaveProduct = (', 'const handleSaveProduct = async ('],
            ['const handleDeleteProduct = (', 'const handleDeleteProduct = async ('],
            ['const handleAddExpense = (', 'const handleAddExpense = async ('],
            ['const handleUpdateExpense = (', 'const handleUpdateExpense = async ('],
            ['const handleDeleteExpense = (', 'const handleDeleteExpense = async ('],
            ['const handleSavePettyCash = (', 'const handleSavePettyCash = async ('],
            ['const handleSaveCustomer = (', 'const handleSaveCustomer = async ('],
            ['const handleDeleteCustomer = (', 'const handleDeleteCustomer = async ('],
            ['const handleToggleMembership = (', 'const handleToggleMembership = async ('],
            ['const handleCancelOrder = (', 'const handleCancelOrder = async ('],
            ['const handleDeleteOrderPermanently = (', 'const handleDeleteOrderPermanently = async ('],
          ];
          for (const [from, to] of handlers) if (s.includes(from)) s = s.replace(from, to);

          function gateUpdated(state, save, sync, failure) {
            const re = new RegExp(`set${state}\\(updated\\);\\s*${save}\\([^\\n]*\\);\\s*${sync}\\(([^;]+)\\);\\s*(showToast\\([^;]+;)?`, 'g');
            s = s.replace(re, (_, args, toast = '') => `const persisted = await ${sync}(${args});\n    if (!persisted) { showToast('${failure}', 'error'); return; }\n    set${state}(updated);\n    ${toast}`);
          }

          gateUpdated('Products', 'saveMerchantProducts', 'syncProductsToFirebase', 'Gagal menyimpan katalog ke cloud. Data lokal tidak diubah.');
          gateUpdated('Orders', 'saveMerchantOrders', 'syncOrdersToFirebase', 'Gagal menyimpan transaksi ke cloud. Transaksi tidak diselesaikan.');
          gateUpdated('Expenses', 'saveMerchantExpenses', 'syncExpensesToFirebase', 'Gagal menyimpan perubahan pengeluaran ke cloud.');
          gateUpdated('Customers', 'saveCustomers', 'syncCustomersToFirebase', 'Gagal menyimpan data customer ke cloud.');

          const petty = new RegExp('setPettyCash\\(amount\\);\\s*saveMerchantPettyCash\\([^\\n]*\\);\\s*syncPettyCashToFirebase\\(([^;]+)\\);\\s*(showToast\\([^;]+;)?', 'g');
          s = s.replace(petty, (_, args, toast = '') => `const persisted = await syncPettyCashToFirebase(${args});\n    if (!persisted) { showToast('Gagal menyimpan modal awal kasir ke cloud.', 'error'); return; }\n    setPettyCash(amount);\n    ${toast}`);

          const unsafe = [
            'saveMerchantProducts(currentMId, currentBType, updated);\n      syncProductsToFirebase',
            'saveMerchantOrders(currentMId, currentBType, updated);\n      syncOrdersToFirebase',
            'saveMerchantExpenses(currentMId, currentBType, updated);\n    syncExpensesToFirebase',
            'saveCustomers(currentMId, updated);\n    syncCustomersToFirebase',
            'saveMerchantPettyCash(currentMId, currentBType, amount);\n    syncPettyCashToFirebase',
          ];
          if (unsafe.some(x => s.includes(x))) throw new Error('Stage 4B left an unsafe pre-sync cache write.');

          s += '\n// STAGE4B_SOURCE_MIGRATED\n';
          fs.writeFileSync(path, s);
          NODE

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "fix: gate mutation success on Firestore persistence"
          git push
