name: Fix printer connection props

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'yunarmedia'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix PrinterView prop wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = """            onConnectPrinterKasir={() => connectBluetoothPrinter('kasir')}\n            onDisconnectPrinterKasir={() => disconnectBluetoothPrinter('kasir')}\n            onConnectPrinterDapur={() => connectBluetoothPrinter('dapur')}\n            onDisconnectPrinterDapur={() => disconnectBluetoothPrinter('dapur')}"""
          new = """            onConnectPrinter={(type) => connectBluetoothPrinter(type)}\n            onDisconnectPrinter={(type) => disconnectBluetoothPrinter(type)}"""
          if old not in text:
              print('Printer prop wiring already fixed or block not found.')
              raise SystemExit(0)
          path.write_text(text.replace(old, new))
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix printer connection callback wiring"
          git push
