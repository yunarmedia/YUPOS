<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>YUPOS Membership Verification</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a}.wrap{min-height:100vh;padding:24px 16px;display:flex;align-items:center;justify-content:center}.card{width:min(100%,560px);background:#fff;border:1px solid #dbe4f0;border-radius:28px;box-shadow:0 20px 60px rgba(15,23,42,.14);overflow:hidden}.hero{padding:26px;background:linear-gradient(135deg,#172554,#2563eb);color:#fff}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.8}.hero h1{margin:6px 0 0;font-size:28px}.code{margin-top:8px;font-size:12px;opacity:.88}.body{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border:1px solid #e2e8f0;border-radius:16px;background:#f8fafc;min-width:0}.label{font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase}.value{margin-top:5px;font-weight:900;font-size:15px;line-height:1.35;word-break:break-word}.reward{margin:16px 0;padding:16px;border-radius:18px;background:#fffbeb;border:1px solid #fcd34d}.reward strong{display:block;color:#92400e;font-size:16px}.reward span{display:block;margin-top:5px;font-size:12px;line-height:1.55;color:#78350f}.last{margin-top:16px;padding:16px;border:1px solid #dbe4f0;border-radius:18px;background:#fff}.last h2{font-size:14px;margin:0 0 10px}.last-items{font-size:13px;font-weight:800;line-height:1.55;color:#0f172a}.last-meta{margin-top:7px;font-size:11px;color:#64748b;line-height:1.5}.claim{margin-top:16px;padding:16px;border-radius:18px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:12px;font-weight:800;line-height:1.6}.claim strong{color:#1d4ed8}.visits{margin-top:18px}.visits h2{font-size:14px;margin:0 0 10px}.visit{padding:12px 0;border-bottom:1px dashed #cbd5e1;font-size:12px;display:flex;justify-content:space-between;gap:10px}.visit:last-child{border-bottom:0}.muted{color:#64748b}.footer{text-align:center;font-size:10px;color:#94a3b8;padding:0 20px 22px}.error{text-align:center;padding:40px 20px;color:#475569}@media(max-width:430px){.wrap{padding:12px 10px}.hero{padding:22px}.body{padding:16px}.grid{gap:8px}.stat{padding:12px}.value{font-size:14px}}
  </style>
</head>
<body>
<div class="wrap"><main class="card" id="app"></main></div>
<script>
(function(){
  const root=document.getElementById('app');
  try{
    const encoded=new URLSearchParams(location.search).get('d');
    if(!encoded) throw new Error('Data membership tidak ditemukan.');
    const normalized=encoded.replace(/-/g,'+').replace(/_/g,'/');
    const binary=atob(normalized+'==='.slice((normalized.length+3)%4));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const raw=JSON.parse(new TextDecoder().decode(bytes));
    const data=raw.v>=3||raw.a==='Y'?{
      code:raw.c||'-',name:raw.n||'Customer',visits:Number(raw.i||0),reward:raw.r||'none',
      memberSince:raw.ms||'-',lastVisit:raw.lv||'-',lastItems:raw.li||'-',visitDetails:[]
    }:raw.v===2?{
      code:raw.c||'-',name:raw.n||'Customer',visits:Number(raw.i||0),reward:raw.r||'none',
      memberSince:'-',lastVisit:'-',lastItems:'-',visitDetails:[]
    }:raw;
    const reward=data.reward==='freeHaircut'?'Cukur GRATIS':data.reward==='discount50'?'Diskon 50%':'Belum ada reward';
    const rewardText=data.reward==='freeHaircut'?'10 kunjungan tercapai — pelanggan berhak claim cukur gratis.':data.reward==='discount50'?'5 kunjungan tercapai — pelanggan berhak claim diskon 50%.':'Kumpulkan 5 kunjungan untuk diskon 50% atau 10 kunjungan untuk cukur gratis.';
    const items=data.lastItems&&data.lastItems!=='-'?data.lastItems:'Belum ada detail paket/treatment/produk.';
    root.innerHTML=`<section class="hero"><div class="eyebrow">YUPOS • MEMBERSHIP VERIFICATION</div><h1>${escapeHtml(data.name||'Customer')}</h1><div class="code">Kode Member: <b>${escapeHtml(data.code||'-')}</b></div></section><section class="body"><div class="grid"><div class="stat"><div class="label">Kunjungan</div><div class="value">${data.visits||0} / 10</div></div><div class="stat"><div class="label">Reward</div><div class="value">${reward}</div></div><div class="stat"><div class="label">Member sejak</div><div class="value">${escapeHtml(data.memberSince||'-')}</div></div><div class="stat"><div class="label">Kunjungan terakhir</div><div class="value">${escapeHtml(data.lastVisit||'-')}</div></div></div><div class="reward"><strong>${reward}</strong><span>${rewardText}</span></div><div class="last"><h2>Paket / Treatment / Produk Terakhir</h2><div class="last-items">${escapeHtml(items)}</div><div class="last-meta">Kunjungan terakhir: ${escapeHtml(data.lastVisit||'-')}</div></div><div class="claim"><strong>Claim reward saat kunjungan berikutnya.</strong><br>Tunjukkan membership verification ini ke kasir untuk melakukan claim reward.</div><div class="visits"><h2>Rincian Kunjungan Membership</h2><div class="muted">QR verifikasi membawa ringkasan membership terbaru: tanggal pembuatan member, kunjungan terakhir, dan paket/treatment/produk terakhir yang dipesan atau dibeli.</div></div></section><div class="footer">YUPOS • One Pos For Everything</div>`;
  }catch(e){root.innerHTML='<div class="error"><b>QR Membership tidak valid</b><p>'+escapeHtml(e.message||'Gagal membaca data membership.')+'</p></div>'}
  function escapeHtml(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}
})();
</script>
</body></html>
